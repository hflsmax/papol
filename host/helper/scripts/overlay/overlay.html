<!doctype html>
<!--
  What the rule-based analyzer found on a paper, drawn over its pages:
  citations blue (labelled with the entry they point at), links to figures
  and tables green, each float (the box a link to it brings into view)
  outlined in thick green, bibliography entries orange (numbered),
  captions purple. Opened by
  render.mjs, which screenshots it; ?sha=<digest>&pages=1,2,3&scale=1.3.
-->
<meta charset="utf-8">
<style>
  body { margin: 0; background: #ddd; font: 11px system-ui, sans-serif; }
  #grid { display: grid; grid-template-columns: repeat(var(--cols), max-content); gap: 10px; padding: 10px; }
  .page { position: relative; background: white; box-shadow: 0 0 3px #999; }
  .page canvas { display: block; }
  .no { position: absolute; top: 2px; left: 4px; font-weight: 700; color: #c00; font-size: 16px; }
  .box { position: absolute; box-sizing: border-box; }
  .cite { border: 1.5px solid #1f5fd6; background: rgba(31, 95, 214, 0.12); }
  .link { border: 1.5px solid #0a8a2a; background: rgba(10, 138, 42, 0.15); }
  .entry { border: 1px solid #e07b00; }
  .caption { border: 1.5px dashed #8a2be2; }
  .target { border: 2px solid #0a8a2a; }
  .tag { position: absolute; font-size: 9px; line-height: 1; padding: 0 2px; color: white; white-space: nowrap; }
  .cite .tag { background: #1f5fd6; top: -9px; left: 0; }
  .entry .tag { background: #e07b00; left: -2px; top: 0; transform: translateX(-100%); }
  .target .tag { background: #0a8a2a; right: 0; top: -10px; }
  #legend { padding: 6px 10px; }
</style>
<div id="legend"></div>
<div id="grid"></div>
<script type="module">
  import * as pdfjs from "/pdfjs/pdf.mjs";
  pdfjs.GlobalWorkerOptions.workerSrc = "/pdfjs/pdf.worker.mjs";
  const q = new URLSearchParams(location.search);
  const sha = q.get("sha"), scale = Number(q.get("scale") || 1.3);
  const wanted = (q.get("pages") || "1").split(",").map(Number);
  document.getElementById("grid").style.setProperty("--cols", q.get("cols") || "2");
  const result = await (await fetch(`/json/${sha}.json`)).json();
  const doc = await pdfjs.getDocument({ url: `/pdf/${sha}.pdf` }).promise;
  const a = result.analysis;
  const entryNo = new Map(a.references.map((r) => [r.key, r.index + 1]));
  document.getElementById("legend").textContent =
    `${sha.slice(0, 10)} · ${result.stats.numbering} · ${a.references.length} refs · ${a.citations.length} cites · ${a.links.length} links · pages ${wanted.join(",")}`;
  const box = (el, b, w, h, cls) => {
    const d = document.createElement("div");
    d.className = `box ${cls}`;
    Object.assign(d.style, { left: `${b.x * w}px`, top: `${b.y * h}px`, width: `${b.w * w}px`, height: `${b.h * h}px` });
    el.appendChild(d);
    return d;
  };
  const tag = (d, text) => { const t = document.createElement("span"); t.className = "tag"; t.textContent = text; d.appendChild(t); };
  for (const n of wanted) {
    if (n < 1 || n > doc.numPages) continue;
    const page = await doc.getPage(n);
    const view = page.getViewport({ scale });
    const div = document.createElement("div");
    div.className = "page";
    div.style.width = `${view.width}px`;
    div.style.height = `${view.height}px`;
    const canvas = document.createElement("canvas");
    canvas.width = view.width; canvas.height = view.height;
    div.appendChild(canvas);
    document.getElementById("grid").appendChild(div);
    await page.render({ canvasContext: canvas.getContext("2d"), viewport: view }).promise;
    const W = view.width, H = view.height;
    for (const item of result.trace) {
      const here = item.boxes.filter((b) => b.page === n);
      if (item.rule.startsWith("entry.")) here.forEach((b) => box(div, b, W, H, "entry"));
      if (item.rule.startsWith("caption.")) here.forEach((b) => box(div, b, W, H, "caption"));
    }
    for (const r of a.references) if (r.page === n) {
      const d = box(div, { x: 0.02, y: r.y, w: 0.0, h: 0.012 }, W, H, "entry");
      tag(d, String(r.index + 1));
    }
    const seen = new Map();
    for (const c of a.citations) if (c.page === n) {
      const k = `${c.x},${c.y},${c.w},${c.h}`;
      seen.set(k, [...(seen.get(k) || []), entryNo.get(c.key)]);
    }
    for (const [k, nos] of seen) {
      const [x, y, w, h] = k.split(",").map(Number);
      const d = box(div, { x, y, w, h }, W, H, "cite");
      tag(d, nos.length > 3 ? `${nos[0]}…${nos[nos.length - 1]}` : nos.join(","));
    }
    for (const l of a.links) if (l.page === n) box(div, l, W, H, "link");
    for (const f of a.floats) if (f.page === n) {
      const d = box(div, f, W, H, "target");
      tag(d, `${f.kind} ${f.label}`);
    }
    const no = document.createElement("span"); no.className = "no"; no.textContent = n; div.appendChild(no);
  }
  document.body.dataset.done = "1";
</script>

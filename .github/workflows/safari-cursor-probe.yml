# Temporary: does Safari's cursor freeze after a double-click on bare paper?
# Real Safari, real pointer events, the system cursor read back; once with
# main's viewer and once with this branch's. Remove before merging.
name: safari-cursor-probe
on:
  push:
    branches: [claude/project-thread-3qolxx]
    paths: ['.github/safari-probe/**', '.github/workflows/safari-cursor-probe.yml', 'viewer/src/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    name: safari-cursor-${{ matrix.viewer }}
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        viewer: [main, branch]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Main's viewer
        if: matrix.viewer == 'main'
        run: git checkout origin/main -- viewer/src
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: viewer
      - name: Serve the fixture with the probe page
        run: |
          node .github/safari-probe/serve.mjs > serve.log 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:5199/probe/ >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:5199/probe/ >/dev/null
      - name: Open Safari on it
        run: |
          open -a Safari http://127.0.0.1:5199/probe/
          sleep 8
      # The hosted image grants these to its own agents, not to a binary
      # built here: added to the system's permission database, as
      # xa11y/setup-a11y does, then tccd restarted to read them.
      - name: Build the probe and let it drive the pointer
        run: |
          swiftc -O .github/safari-probe/probe.swift -o probe
          csrutil status || true
          client="$PWD/probe"
          for db in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
            for service in kTCCServiceAccessibility kTCCServicePostEvent kTCCServiceScreenCapture; do
              sudo sqlite3 "$db" "INSERT OR REPLACE INTO access(service,client,client_type,auth_value,auth_reason,auth_version,csreq,policy_id,indirect_object_identifier_type,indirect_object_identifier,indirect_object_code_identity,flags,last_modified) VALUES('$service','$client',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$(date +%s));" || echo "could not write $service to $db"
            done
          done
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "SELECT service, client, auth_value FROM access WHERE service IN ('kTCCServiceAccessibility','kTCCServicePostEvent') AND (client LIKE '%probe%' OR client='/bin/bash' OR client LIKE '%provisioner%' OR client LIKE '%hca%');" || true
          sudo launchctl stop com.apple.tccd 2>/dev/null || true
          sudo killall tccd 2>/dev/null || true
          sleep 3
      - name: Drive the pointer and read the cursor
        run: ./probe | tee probe.log
      - name: What the page saw
        if: always()
        run: cat serve.log || true
      - name: Screenshot
        if: always()
        run: screencapture -C -x screen.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-cursor-${{ matrix.viewer }}
          path: |
            probe.log
            serve.log
            screen.png

# Temporary: does Safari's cursor freeze after a double-click on bare paper?
# Real Safari, real pointer events, the system cursor read back; once with
# main's viewer and once with this branch's. Remove before merging.
name: safari-cursor-probe
on:
  push:
    branches: [claude/project-thread-3qolxx]
    paths: ['.github/safari-probe/**', '.github/workflows/safari-cursor-probe.yml', 'viewer/src/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    name: safari-cursor-${{ matrix.viewer }}
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        viewer: [main, branch]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Main's viewer
        if: matrix.viewer == 'main'
        run: git checkout origin/main -- viewer/src
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: viewer
      - name: Serve the fixture with the probe page
        run: |
          node .github/safari-probe/serve.mjs > serve.log 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:5199/probe/ >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:5199/probe/ >/dev/null
      - name: Open Safari on it
        run: |
          open -a Safari http://127.0.0.1:5199/probe/
          sleep 8
          osascript -e 'tell application "Safari" to activate' || true
          osascript -e 'tell application "Safari" to set bounds of front window to {0, 30, 1280, 900}' || true
          sleep 4
      - name: Drive the pointer and read the cursor
        run: swiftc -O .github/safari-probe/probe.swift -o probe && ./probe | tee probe.log
      - name: Screenshot
        if: always()
        run: screencapture -C -x screen.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-cursor-${{ matrix.viewer }}
          path: |
            probe.log
            serve.log
            screen.png

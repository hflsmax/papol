# Temporary: hands the 0.7.0 dry run's notarized DMG to a draft release,
# so it can be copied to a Mac for hands-on testing. Deleted right after.
name: Mac test build
on:
  push:
    branches: [claude/project-thread-frgdi2]
    paths: [.github/workflows/mac-test-build.yml]
permissions:
  contents: write
  actions: read
jobs:
  hand-over:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dmg
          run-id: 45098925385
          github-token: ${{ github.token }}
          path: dmg
      - name: Draft release holding the DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dmg
          gh release create test-build-do-not-publish --repo "$GITHUB_REPOSITORY" --draft \
            --target "$GITHUB_SHA" --title "Test build, do not publish" \
            --notes "Temporary copy of a release dry run's DMG for hands-on testing. Will be deleted." dmg/*.dmg

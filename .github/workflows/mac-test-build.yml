# Temporary: hands the release dry run's notarized DMG to a draft release,
# so it can be copied to a Mac for hands-on testing. The draft and this file
# are removed before this branch's pull request is ready.
name: Mac test build
on:
  push:
    branches: [claude/project-thread-frgdi2]
    paths: [.github/workflows/mac-test-build.yml]
permissions:
  contents: write
jobs:
  hand-over:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete the test draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete test-build-do-not-publish --repo "$GITHUB_REPOSITORY" --yes

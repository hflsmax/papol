name: Papol macOS

# The test job is the gate, and it runs everywhere code moves: every pull
# request, every push to main, and the release tag itself. It carries the
# suites, the browser smokes (desk against replica rows, a citation clicked
# in the viewer, a board's cards drawn), and the native lints, on the runner
# that matches the machine the app ships to. Only a tag goes on to build,
# notarize, and publish.
on:
  pull_request:
  push:
    branches: [main]
    tags:
      - "macos-v*"
  workflow_dispatch:

# A superseded PR or main run is not worth finishing; a tag run always is.
concurrency:
  group: desktop-macos-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Testing needs to read the code and nothing else; only publishing a
# release writes. Granted where it is used, not to every PR that runs.
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/macos-v')
        run: |
          set -euo pipefail
          version=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          [ "$GITHUB_REF_NAME" = "macos-v$version" ] || {
            echo "tag $GITHUB_REF_NAME does not match app version $version" >&2
            exit 1
          }

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json
            viewer/package-lock.json
            board/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Install bundled UI dependencies
        working-directory: desktop
        run: npm run install:web

      - name: Test bundled UI and native shell
        working-directory: desktop
        run: npm test

      - name: Check native formatting and lints
        working-directory: desktop
        run: npm run check:native

  build:
    needs: test
    # A dispatched run is the gate alone; only a tag builds and publishes.
    if: startsWith(github.ref, 'refs/tags/macos-v')
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json
            viewer/package-lock.json
            board/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Install bundled UI dependencies
        working-directory: desktop
        run: npm run install:web

      - name: Build, sign, and notarize app
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop
          args: --target aarch64-apple-darwin

      # Tauri notarizes and staples the app, but only signs the DMG around it.
      # Notarize the disk image as well so the download itself carries a ticket.
      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          VERSION: ${{ steps.tauri.outputs.appVersion }}
        run: |
          set -euo pipefail
          dmg=$(jq -r '.[] | select(endswith(".dmg"))' <<<"$ARTIFACT_PATHS")
          [ -f "$dmg" ] || { echo "no DMG among the build artifacts" >&2; exit 1; }
          xcrun notarytool submit "$dmg" --wait \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID"
          xcrun stapler staple "$dmg"
          mkdir -p release
          mv "$dmg" "release/Papol_${VERSION}_macOS.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: dmg
          path: release/*.dmg
          if-no-files-found: error

  # Publish only once the DMG is notarized, so a failed build never leaves a
  # partial release behind. The pushed tag already pins the
  # release commit; gh omits target_commitish, which would otherwise make
  # GitHub demand workflows permission (which GITHUB_TOKEN cannot have).
  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dmg
          path: release

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release/*.dmg \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Papol macOS v${GITHUB_REF_NAME#macos-v}" \
            --notes "Download the signed and notarized Papol DMG for your Mac (Apple Silicon)."

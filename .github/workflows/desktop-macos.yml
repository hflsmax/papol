name: Papol macOS

# The test and end-to-end jobs are the gate, and they run everywhere code
# moves: every pull request, every push to main, and the release tag itself.
# Between them they carry the suites, the browser smokes (desk against
# replica rows, a citation clicked in the viewer, a board's cards drawn),
# the native lints, and the real app signed in to a real backend, on the
# runner that matches the machine the app ships to. Only a tag goes on to
# build, notarize, and publish.
on:
  pull_request:
  push:
    branches: [main]
    tags:
      - "macos-v*"
  workflow_dispatch:

# A superseded PR or main run is not worth finishing; a tag run always is.
concurrency:
  group: desktop-macos-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Testing needs to read the code and nothing else; only publishing a
# release writes. Granted where it is used, not to every PR that runs.
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/macos-v')
        run: |
          set -euo pipefail
          version=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          [ "$GITHUB_REF_NAME" = "macos-v$version" ] || {
            echo "tag $GITHUB_REF_NAME does not match app version $version" >&2
            exit 1
          }

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json
            viewer/package-lock.json
            board/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Install bundled UI dependencies
        working-directory: desktop
        run: npm run install:web

      - name: Test bundled UI and native shell
        working-directory: desktop
        run: npm test

      - name: Check native formatting and lints
        working-directory: desktop
        run: npm run check:native

  # The shell itself, against a service. The test job's smokes open the
  # bundled pages in a browser with a mocked bridge, and its cargo tests
  # drive the replica with no window anywhere; nothing there says whether
  # the application a person opens comes up, takes a sign-in, and shows
  # the paper the service holds. This job starts the real backend — the
  # Worker, on wrangler's local runtime — compiles the real app against it,
  # and asks its window — through the accessibility API, the only way into
  # a WKWebView — for exactly that. nix rather than the toolchain actions,
  # because the Node and the Rust it needs are listed nowhere but flake.nix.
  end-to-end:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v13

      # The accessibility API answers only a process the user has trusted,
      # and there is no user here to click. macOS charges a command-line
      # tool's request to the launchd job its ancestor was started by, so
      # every executable up this step's process tree is written into the
      # system TCC database — root-writable on the hosted runners, which
      # ship with System Integrity Protection off — and the driver is asked
      # afterwards whether it is trusted, so a grant that did not take fails
      # here, with that message, rather than later as an app with no window.
      - name: Let this job drive the app's interface
        run: |
          set -euo pipefail
          csrutil status || true
          db='/Library/Application Support/com.apple.TCC/TCC.db'
          pid=$$
          while [ "$pid" -gt 1 ]; do
            client=$(ps -o comm= -p "$pid")
            echo "trusting $client"
            sudo sqlite3 "$db" "INSERT OR REPLACE INTO access
              (service, client, client_type, auth_value, auth_reason, auth_version, flags)
              VALUES ('kTCCServiceAccessibility', '$client', 1, 2, 4, 1, 0);"
            pid=$(ps -o ppid= -p "$pid" | tr -d ' ')
          done
          sudo killall tccd || true
          xcrun swift desktop/scripts/papol-ui.swift windows

      - name: Install desktop and bundled UI dependencies
        run: nix develop --command bash -c 'cd desktop && npm ci && npm run install:web'

      - name: The replica against the service
        run: nix develop --command bash -c 'cd desktop && npm run test:e2e:native-sync'

      - name: The app against the service
        env:
          PAPOL_E2E_ARTIFACTS: ${{ runner.temp }}/e2e
        run: nix develop --command bash -c 'cd desktop && npm run test:e2e:native-ui'

      - name: Keep what the window showed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-ui-failure
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore

  build:
    needs: [test, end-to-end]
    # A dispatched run is the gate alone; only a tag builds and publishes.
    if: startsWith(github.ref, 'refs/tags/macos-v')
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json
            viewer/package-lock.json
            board/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Install bundled UI dependencies
        working-directory: desktop
        run: npm run install:web

      - name: Build, sign, and notarize app
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop
          args: --target aarch64-apple-darwin

      # Tauri notarizes and staples the app, but only signs the DMG around it.
      # Notarize the disk image as well so the download itself carries a ticket.
      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          VERSION: ${{ steps.tauri.outputs.appVersion }}
        run: |
          set -euo pipefail
          dmg=$(jq -r '.[] | select(endswith(".dmg"))' <<<"$ARTIFACT_PATHS")
          [ -f "$dmg" ] || { echo "no DMG among the build artifacts" >&2; exit 1; }
          xcrun notarytool submit "$dmg" --wait \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID"
          xcrun stapler staple "$dmg"
          mkdir -p release
          mv "$dmg" "release/Papol_${VERSION}_macOS.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: dmg
          path: release/*.dmg
          if-no-files-found: error

  # Publish only once the DMG is notarized, so a failed build never leaves a
  # partial release behind. The pushed tag already pins the
  # release commit; gh omits target_commitish, which would otherwise make
  # GitHub demand workflows permission (which GITHUB_TOKEN cannot have).
  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dmg
          path: release

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release/*.dmg \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Papol macOS v${GITHUB_REF_NAME#macos-v}" \
            --notes "Download the signed and notarized Papol DMG for your Mac (Apple Silicon)."

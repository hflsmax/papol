name: Papol macOS

# The test and end-to-end jobs are the gate, and they run everywhere code
# moves: every pull request, every push to main, and the release tag itself.
# Between them they carry the crate's tests, the native lints, and the real
# app signed in to a real backend, on the runner that matches the machine
# the app ships to; the bundled pages' suites and browser smokes are
# pr.yml's, on Linux. Only a tag goes on to build, notarize, and publish.
#
# A pull request labelled `hotfix` skips both (a skipped job passes its
# check), so it merges at once; labelling runs this again.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    tags:
      - "macos-v*"
  workflow_dispatch:

# A superseded PR or main run is not worth finishing; a tag run always is.
concurrency:
  group: desktop-macos-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Testing needs to read the code and nothing else; only publishing a
# release writes. Granted where it is used, not to every PR that runs.
permissions:
  contents: read

jobs:
  # What only a Mac can check: the crate's tests against the real
  # frameworks, its formatting and lints, and the Info.plist writer the
  # build runs. The bundled pages' suites and browser smokes are not
  # repeated here; they run on Linux in pr.yml, drive Chromium on either
  # runner, and a macOS minute costs ten Linux ones.
  test:
    # Branch protection requires this name; keep it stable.
    name: macos-test
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'hotfix')
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/macos-v')
        run: |
          set -euo pipefail
          version=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          [ "$GITHUB_REF_NAME" = "macos-v$version" ] || {
            echo "tag $GITHUB_REF_NAME does not match app version $version" >&2
            exit 1
          }

      # The plist writer's test needs Node and nothing from npm.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Read the pinned Rust
        id: rust
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' desktop/src-tauri/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      # The version comes from rust-toolchain.toml; see its head for why.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: clippy, rustfmt

      # Saved from main only: every PR branch writing its own target/
      # would push the repository past GitHub's 10 GB and evict the rest.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # No bundled pages are built: a debug `cargo test` is Tauri's dev
      # mode, which serves devUrl and does not embed ../dist.
      - name: Test the native shell
        working-directory: desktop
        run: npm run test:native

      - name: Check native formatting and lints
        working-directory: desktop
        run: npm run check:native

  # The shell itself, against a service. pr.yml's smokes open the bundled
  # pages in a browser with a mocked bridge, and the test job's cargo tests
  # drive the replica with no window anywhere; nothing there says whether
  # the application a person opens comes up, takes a sign-in, and shows
  # the paper the service holds. This job starts the real backend — the
  # Worker, on wrangler's local runtime — compiles the real app against it,
  # and asks its window — through the accessibility API, the only way into
  # a WKWebView — for exactly that, then for a shelf added while the service
  # is down and a PDF opened with the app, both followed to the service. It
  # also has the page capture photograph a served fixture and refuse the
  # pages that lead to this machine. nix rather than the toolchain actions,
  # because the Node and the Rust it needs are listed nowhere but flake.nix.
  end-to-end:
    name: macos-end-to-end
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'hotfix')
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      # The accessibility API answers only a process the user has trusted,
      # and there is no user here to click. macOS charges a command-line
      # tool's request to the launchd job its ancestor was started by, so
      # every executable up this step's process tree is written into the
      # system TCC database — root-writable on the hosted runners, which
      # ship with System Integrity Protection off — and the driver is asked
      # afterwards whether it is trusted, so a grant that did not take fails
      # here, with that message, rather than later as an app with no window.
      - name: Let this job drive the app's interface
        run: |
          set -euo pipefail
          csrutil status || true
          db='/Library/Application Support/com.apple.TCC/TCC.db'
          pid=$$
          while [ "$pid" -gt 1 ]; do
            client=$(ps -o comm= -p "$pid")
            echo "trusting $client"
            sudo sqlite3 "$db" "INSERT OR REPLACE INTO access
              (service, client, client_type, auth_value, auth_reason, auth_version, flags)
              VALUES ('kTCCServiceAccessibility', '$client', 1, 2, 4, 1, 0);"
            pid=$(ps -o ppid= -p "$pid" | tr -d ' ')
          done
          sudo killall tccd || true
          xcrun swift desktop/scripts/papol-ui.swift windows

      - name: Install desktop and bundled UI dependencies
        run: nix develop --command bash -c 'cd desktop && npm ci && npm run install:web'

      # The disposable backend the checks start is `wrangler dev`.
      - name: Install the Worker's dependencies
        run: nix develop --command bash -c 'cd cloudflare && npm ci --legacy-peer-deps'

      - name: The replica against the service
        run: nix develop --command bash -c 'cd desktop && npm run test:e2e:native-sync'

      # The capture refuses a local link and WebKit's rules refuse any
      # address that spells one, so the fixture it photographs is served on
      # loopback under a name that looks public. The rules read the name,
      # not where it resolves, which is what lets the app's own code take
      # the picture with no test-only way around its guard.
      - name: Name the capture fixture
        run: |
          set -euo pipefail
          echo '127.0.0.1 capture-fixture.papol.test' | sudo tee -a /etc/hosts
          sudo dscacheutil -flushcache
          sudo killall -HUP mDNSResponder || true

      - name: The page capture and its guard
        env:
          PAPOL_E2E_ARTIFACTS: ${{ runner.temp }}/capture-e2e
        run: nix develop --command bash -c 'cd desktop && npm run test:e2e:capture'

      - name: Keep the pictures the capture took
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: capture-pictures
          path: ${{ runner.temp }}/capture-e2e
          if-no-files-found: ignore

      - name: The app against the service
        env:
          PAPOL_E2E_ARTIFACTS: ${{ runner.temp }}/e2e
        run: nix develop --command bash -c 'cd desktop && npm run test:e2e:native-ui'

      - name: Keep what the window showed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-ui-failure
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore

  build:
    name: macos-build
    needs: [test, end-to-end]
    # A dispatched run is the gate alone; only a tag builds and publishes.
    if: startsWith(github.ref, 'refs/tags/macos-v')
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json
            viewer/package-lock.json
            board/package-lock.json

      - name: Read the pinned Rust
        id: rust
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' desktop/src-tauri/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      # The release is compiled by the Rust the gate tested with.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: aarch64-apple-darwin

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Install bundled UI dependencies
        working-directory: desktop
        run: npm run install:web

      - name: Build, sign, and notarize app
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop
          args: --target aarch64-apple-darwin

      # Tauri notarizes and staples the app, but only signs the DMG around it.
      # Notarize the disk image as well so the download itself carries a ticket.
      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          VERSION: ${{ steps.tauri.outputs.appVersion }}
        run: |
          set -euo pipefail
          dmg=$(jq -r '.[] | select(endswith(".dmg"))' <<<"$ARTIFACT_PATHS")
          [ -f "$dmg" ] || { echo "no DMG among the build artifacts" >&2; exit 1; }
          xcrun notarytool submit "$dmg" --wait \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID"
          xcrun stapler staple "$dmg"
          mkdir -p release
          mv "$dmg" "release/Papol_${VERSION}_macOS.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: dmg
          path: release/*.dmg
          if-no-files-found: error

  # Publish only once the DMG is notarized, so a failed build never leaves a
  # partial release behind. The pushed tag already pins the
  # release commit; gh omits target_commitish, which would otherwise make
  # GitHub demand workflows permission (which GITHUB_TOKEN cannot have).
  release:
    name: macos-release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dmg
          path: release

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release/*.dmg \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Papol macOS v${GITHUB_REF_NAME#macos-v}" \
            --notes "Download the signed and notarized Papol DMG for your Mac (Apple Silicon)."

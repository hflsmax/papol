name: Papol PR

# Every pull request answers two questions: do the suites pass, and does a
# user driving the real pages see them work. The browser half exists because
# a passing suite is not a working link — the SPA answers dead URLs with the
# page itself, status 200, and only a browser watching the wire notices.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v13

      # Ubuntu 24 confines unprivileged user namespaces, which is how
      # Chromium builds its sandbox; the nix chromium has no setuid fallback.
      - name: Let Chromium sandbox itself
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Unit tests, all five surfaces
        run: |
          nix develop --command bash -c 'cd viewer   && npm ci && npm test'
          nix develop --command bash -c 'cd board    && npm ci && npm test'
          nix develop --command bash -c 'cd frontend && npm ci && npm test'
          # The Worker the backend is becoming (docs/cloud-migration.md, phase
          # 4): its suite runs in the Workers runtime against a local D1.
          # --legacy-peer-deps because npm's peer resolver crashes on Vitest
          # 5's optional peers while the pool still wants Vitest 4.
          nix develop --command bash -c 'cd cloudflare && npm ci --legacy-peer-deps && npm run typecheck && npm test'
          # The backend suite levels its schema, so it runs only against a
          # database named *_test; `./deploy.sh db` brings the cluster up and
          # this is the invocation it prints.
          nix develop --command bash -c './deploy.sh db && cd backend && DATABASE_URL="postgresql+psycopg://papol@/papol_test?host=$PWD/../.postgres" python -m unittest'

      - name: Start a development server
        run: |
          PAPOL_DEV_PORT=8010 nohup ./deploy.sh dev --no-watch > server.log 2>&1 &
          for _ in $(seq 90); do
            curl -fsS http://127.0.0.1:8010/openapi.json > /dev/null 2>&1 && exit 0
            sleep 2
          done
          echo 'the server never came up'; cat server.log; exit 1

      - name: Browser suite over the real pages
        env:
          PAPOL_BASE: http://127.0.0.1:8010
        run: |
          nix develop --command bash -c '
            set -e
            export PAPOL_E2E_FIXTURE="$PWD/e2e-fixture.json"
            export CHROME="$(command -v chromium)"
            python3 scripts/share-e2e/seed.py
            node scripts/share-e2e/run.mjs'

      - name: Server log
        if: failure()
        run: cat server.log || true

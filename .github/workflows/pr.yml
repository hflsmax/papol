name: Papol PR

# Every pull request answers two questions: do the suites pass, and does a
# user driving the real pages see them work. The browser half exists because
# a passing suite is not a working link — the SPA answers dead URLs with the
# page itself, status 200, and only a browser watching the wire notices.
#
# This is also where a pull request runs the Worker's suite: worker.yml runs
# it again only in front of a deploy, so a PR pays for it once.

#
# A pull request labelled `hotfix` skips the suites: GitHub counts a skipped
# job as a passing check, so it merges at once. Labelling runs this again;
# the deploy (worker.yml) still runs the Worker's suite before it ships.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

# A newer run of the same pull request (a push, the hotfix label) replaces
# the one under way.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The suites read the code and nothing else.
permissions:
  contents: read

jobs:
  tests:
    # Branch protection requires this name; keep it stable.
    name: tests
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'hotfix')
    # Pinned rather than -latest: the sysctl below is an Ubuntu 24 answer,
    # and an image that moved under it would fail as a browser that will
    # not start rather than as a changed runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Two commits deep, so a pull request's merge commit has its base
      # (HEAD^1) beside it for the migrations check.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # A migration D1 has applied is history: dev and production record it
      # by name, and an edit to it never reaches either database. So a pull
      # request may add files under cloudflare/migrations/ and nothing else.
      - name: Migrations are only ever added
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-status --no-renames --diff-filter=DMT HEAD^1 HEAD -- cloudflare/migrations/)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo 'an applied migration was edited or removed; add a new one instead' >&2
            exit 1
          fi

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      # The Mac jobs install Rust with rustup, not nix, and clippy's
      # -D warnings turns each new release's lints into a red build; so the
      # version is written down once, in rust-toolchain.toml, and this holds
      # it to the rustc the flake's nixpkgs carries. A flake.lock bump that
      # moves rustc fails here until the file moves with it.
      - name: The Mac's Rust is the flake's
        run: |
          want=$(sed -n 's/^channel = "\(.*\)"$/\1/p' desktop/src-tauri/rust-toolchain.toml)
          # The shell's greeting shares stdout; take the rustc line alone.
          have=$(nix develop --command rustc --version | sed -n 's/^rustc \([0-9.]*\).*/\1/p')
          echo "rust-toolchain.toml says $want, the flake has $have"
          [ -n "$want" ] && [ "$want" = "$have" ]

      # Ubuntu 24 confines unprivileged user namespaces, which is how
      # Chromium builds its sandbox; the nix chromium has no setuid fallback.
      - name: Let Chromium sandbox itself
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Unit tests, all four surfaces
        env:
          # The upload smoke (frontend `npm test`) keeps the page here if it fails.
          PAPOL_E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
        run: |
          nix develop --command bash -c 'cd viewer   && npm ci && npm test'
          nix develop --command bash -c 'cd board    && npm ci && npm test'
          nix develop --command bash -c 'cd frontend && npm ci && npm test'
          # The Worker: its suite runs in the Workers runtime against a local
          # D1. --legacy-peer-deps because npm's peer resolver crashes on
          # Vitest 5's optional peers while the pool still wants Vitest 4.
          nix develop --command bash -c 'cd cloudflare && npm ci --legacy-peer-deps && npm run typecheck && npm test'
          # The host's helper beside GROBID: its tests, and the checked-in
          # bundle rebuilt to prove it is what the source says (`check`).
          nix develop --command bash -c 'cd host/helper && npm ci && npm run typecheck && npm run check && npm test'

      # The helper beside GROBID, stood in for: canned answers in the real
      # one's shapes, told per PDF by the upload suite what to say.
      - name: Start the stand-in GROBID helper
        run: |
          nohup nix develop --command node scripts/share-e2e/fake-helper.mjs > helper.log 2>&1 &
          for _ in $(seq 60); do
            curl -fsS -o /dev/null -u papol:e2e http://127.0.0.1:8072/helper/health 2>/dev/null && exit 0
            sleep 1
          done
          echo 'the stand-in helper never came up'; cat helper.log; exit 1

      # The Worker as it is deployed: the three builds laid out as its
      # assets, a migrated local D1 beneath it, on a port of its own.
      # --test-scheduled opens /__scheduled, so the suite can fire the cron
      # sweep when it chooses; GROBID_URL and GROBID_AUTH point the reading
      # of an upload at the stand-in above.
      - name: Start the Worker on the assembled site
        run: |
          nix develop --command bash -c 'cloudflare/scripts/assemble.sh && cd cloudflare && npx wrangler d1 migrations apply papol --local'
          cd cloudflare && nohup nix develop .. --command npx wrangler dev --ip 127.0.0.1 --port 8010 --show-interactive-dev-session=false \
            --test-scheduled --var GROBID_URL:http://127.0.0.1:8072 --var GROBID_AUTH:papol:e2e > ../server.log 2>&1 &
          for _ in $(seq 90); do
            curl -fsS -o /dev/null http://127.0.0.1:8010/ 2>/dev/null && exit 0
            sleep 2
          done
          echo 'the Worker never came up'; cat server.log; exit 1

      # Every suite runs even when one before it failed, so one red run
      # shows every failure at once.
      - name: Browser suite over the real pages
        env:
          PAPOL_BASE: http://127.0.0.1:8010
          PAPOL_E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
        run: |
          nix develop --command bash -c '
            set -e
            export PAPOL_E2E_FIXTURE="$PWD/e2e-fixture.json"
            export CHROME="$(command -v chromium)"
            node scripts/share-e2e/seed.mjs
            failed=0
            node scripts/share-e2e/run.mjs || failed=1
            node scripts/share-e2e/upload.mjs || failed=1
            node scripts/share-e2e/board.mjs || failed=1
            exit $failed'

      - name: Pages as the failing checks left them
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-pages
          path: e2e-artifacts/
          if-no-files-found: ignore

      - name: Worker log
        if: failure()
        run: cat server.log helper.log || true

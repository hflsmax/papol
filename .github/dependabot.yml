version: 2
updates:
  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  # react and react-dom must move together, so each app gets them in one PR.
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
  - package-ecosystem: npm
    directory: /viewer
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
  - package-ecosystem: npm
    directory: /board
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  # Third-party actions are pinned to commit SHAs with the tag beside them
  # as a comment; this moves both together.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  # The Worker's install needs --legacy-peer-deps (see pr.yml), which
  # Dependabot is not told; an update it cannot resolve says so in its log.
  - package-ecosystem: npm
    directory: /cloudflare
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /host/helper
    schedule: { interval: weekly }
    open-pull-requests-limit: 5

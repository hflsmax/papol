# Papol on Cloudflare: one Worker for the API and the jobs.
#
# Bindings are added as the phases of docs/cloud-migration.md land. The
# database id below is the local development database's name; the real
# one is written here when the production database is made (phase 5).

name = "papol"
main = "src/index.ts"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

# papol.io is the only door.
workers_dev = false
preview_urls = false

# Papol's own hostname, and www beside it. A custom domain: Cloudflare
# writes the DNS records on deploy, and the workers.dev address stays as
# a second door until the cutover is done.
routes = [
  { pattern = "papol.io", custom_domain = true },
  { pattern = "www.papol.io", custom_domain = true },
]

[[d1_databases]]
binding = "DB"
database_name = "papol"
database_id = "4a3f822d-7dd5-41df-94a5-cf10f0adb6fa"
migrations_dir = "migrations"

# The files: a paper's PDF and a user's picture under uploads/, a
# board's files and the desktop's blobs under board_uploads/
# (src/files.ts). One bucket, public by key at FILES_URL below:
# every key is a digest or a minted uuid, so holding one is holding
# the file, and nothing in the bucket is listed.
[[r2_buckets]]
binding = "FILES"
bucket_name = "papol-files"

# The wake-up for a job the API wrote to the `jobs` table (src/jobs).
# One message, one job; the table holds the outcome, so a message is
# never retried.
[[queues.producers]]
binding = "JOBS"
queue = "papol-jobs"

[[queues.consumers]]
queue = "papol-jobs"
max_batch_size = 1
max_retries = 0

# The browser that captures a webpage for a board card (src/jobs/capture.ts).
[browser]
binding = "BROWSER"

# Every two minutes, jobs nobody was woken for; every hour, the daily
# digest if it is its hour (src/jobs/run.ts).
[triggers]
crons = ["*/2 * * * *", "0 * * * *"]

# Secrets are set with `wrangler secret put`, never written here:
# EMAIL_API_URL, EMAIL_API_KEY and EMAIL_FROM for mail (src/jobs/mail.ts),
# R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY for the upload addresses
# (src/files.ts). FILES_BUCKET names the bucket bound as FILES
# once more, for the S3 URL a browser or the desktop uploads to; the bucket's CORS rules
# (reads from the domain and that PUT) are r2-cors-public.json, applied
# by hand as the FILES_URL comment below says.
[vars]
PAPOL_URL = "https://papol.io"
FILES_BUCKET = "papol-files"
# Where the bucket answers for its own files (src/files.ts): a
# custom domain on the R2 bucket, cached at the edge, with no Worker in
# the path. Empty, the Worker serves the file itself (local development;
# the suite pins it empty in vitest.config.ts). The domain exposes every
# key in the bucket, board files included — the owner's decision: a key
# is a content digest or a uuid minted for one write, so whoever has one
# has the file already (docs/cloud-migration.md, phase 5, step 13). The
# bucket's CORS rules are r2-cors-public.json, applied by hand:
#   npx wrangler r2 bucket cors set papol-files --file r2-cors-public.json
# R2 says `Vary: Origin` only to a request that has an Origin, so a PDF
# opened directly was kept by the browser with no CORS header and handed
# to the viewer's fetch, which failed ("Failed to fetch"). A response
# header Transform Rule on the papol.io zone ("Files vary by Origin",
# made 2026-09-25) sets `Vary: Origin` on every answer from files.papol.io
# and files-dev.papol.io; it lives in the dashboard, not here.
FILES_URL = "https://files.papol.io"

[observability]
enabled = true

# The built front ends, assembled by scripts/assemble.sh: the Worker serves
# them as static assets. Every request passes through the Worker first, so
# one router decides what is an API path, a board document, or a file.
[assets]
directory = "./site"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
run_worker_first = true

# ---------------------------------------------------------------- dev
# A second Papol on the same platform, with its own data, at dev.papol.io:
# where a branch meets Cloudflare's real limits before it meets people.
# `wrangler deploy --env dev`. Bindings do not inherit, so each is named
# again; the assets and the code are the same. Its data is a copy of
# production's, taken when the refresh-dev workflow is run
# (cloudflare/scripts/refresh-dev.py); it has no mail secrets.
[env.dev]
name = "papol-dev"
workers_dev = false
preview_urls = false
routes = [{ pattern = "dev.papol.io", custom_domain = true }]

[env.dev.vars]
PAPOL_URL = "https://dev.papol.io"
FILES_BUCKET = "papol-files-dev"
FILES_URL = "https://files-dev.papol.io"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "papol-dev"
database_id = "074374fd-76b8-4acb-85fb-b03017e90865"
migrations_dir = "migrations"

[[env.dev.r2_buckets]]
binding = "FILES"
bucket_name = "papol-files-dev"

[[env.dev.queues.producers]]
binding = "JOBS"
queue = "papol-jobs-dev"

[[env.dev.queues.consumers]]
queue = "papol-jobs-dev"
max_batch_size = 1
max_retries = 0

[env.dev.browser]
binding = "BROWSER"

[env.dev.triggers]
crons = ["*/2 * * * *", "0 * * * *"]

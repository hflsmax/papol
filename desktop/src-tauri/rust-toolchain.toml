# The desktop crate's Rust, for a plain rustup and the macos-test job.
# mise.toml pins the same version for a mise shell and the end-to-end jobs,
# and pr.yml fails when the two part. Pinned rather than `stable` because
# clippy runs with -D warnings, and every new stable release would otherwise
# arrive as a red build nobody changed.
[toolchain]
channel = "1.95.0"
components = ["clippy", "rustfmt"]

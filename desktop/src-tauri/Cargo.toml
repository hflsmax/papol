[package]
name = "papol-desktop"
version = "0.2.1"
description = "The Papol macOS application"
authors = ["Papol contributors"]
edition = "2021"

[lib]
name = "papol_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.11"
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.dev]
# Full debug info keeps an object file per codegen unit on macOS, which grew
# target/debug past 14 GB. Line tables still give usable backtraces.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
# Keep normal speed-oriented release optimization, but do not ship local
# symbol-table names that the application cannot use at runtime.
strip = "symbols"

# Included in Tauri 2.12. Remove this patch after upgrading.
[patch.crates-io]
tao = { git = "https://github.com/tauri-apps/tao", rev = "7d2cdb1aedb992e6b70d104b392809847944edd6" }
